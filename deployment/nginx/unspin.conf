# UNSPIN reverse proxy. Replace your.domain; certbot --nginx adds the certificate lines.

limit_req_zone $binary_remote_addr zone=unspin_api:10m rate=10r/s;
# Uploads and extraction starts are what cost money or disk; keep them tight.
limit_req_zone $binary_remote_addr zone=unspin_costly:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=unspin_conn:10m;

# Path only, no query string or body. Share tokens must never appear in a URL path
# (see the share route proposal: token travels in a header from a URL fragment).
log_format unspin_min '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name your.domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain;

    # ssl_certificate / ssl_certificate_key managed by certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # App limit is 10 MiB; allow multipart overhead.
    client_max_body_size 11m;
    limit_conn unspin_conn 20;

    access_log /var/log/nginx/unspin.access.log unspin_min;

    location = /api/v1/sources {
        limit_req zone=unspin_costly burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/extractions {
        limit_req zone=unspin_costly burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }

    location /api/ {
        limit_req zone=unspin_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
